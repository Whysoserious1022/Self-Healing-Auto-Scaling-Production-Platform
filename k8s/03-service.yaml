apiVersion: v1
kind: Service
metadata:
  name: production-api-service
  namespace: production-platform
  labels:
    app: production-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: production-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
